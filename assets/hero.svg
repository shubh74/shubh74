<svg viewBox="0 0 1200 340" width="1200" height="340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#7c4dff;#ec4899;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#7c4dff"><animate attributeName="stop-color" values="#7c4dff;#ec4899;#22d3ee;#7c4dff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#22d3ee;#7c4dff;#ec4899" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="blobV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.55"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="42"/></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#07070e"/>

    <ellipse cx="300" cy="110" rx="260" ry="180" fill="url(#blobV)" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 130 50; -50 -20; 0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="920" cy="250" rx="280" ry="190" fill="url(#blobC)" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -110 -45; 60 30; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#ffffff">
      <circle cx="150" cy="70" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="90" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="270" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="285" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="48" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="300" r="1.3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="-220" y="0" width="150" height="340" fill="#ffffff" opacity="0.045">
      <animate attributeName="x" values="-220;1240" dur="7.5s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <g filter="url(#glow)">
      <text x="600" y="172" text-anchor="middle" font-size="86" font-weight="800" letter-spacing="2" fill="url(#aurora)" opacity="0">Shubh Mehta
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 28;0 0" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      </text>
    </g>

    <rect y="198" height="3" rx="2" fill="url(#aurora)" x="600" width="0">
      <animate attributeName="width" values="0;300" dur="0.9s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="x" values="600;450" dur="0.9s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <text x="600" y="242" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="7" fill="#e2e8f0" opacity="0">ARTIST TURNED ENGINEER
      <animate attributeName="opacity" values="0;0.96" dur="0.9s" begin="1.35s" fill="freeze"/>
    </text>
    <text x="600" y="276" text-anchor="middle" font-size="13.5" font-weight="500" letter-spacing="3.5" fill="#7c8599" opacity="0">DEVELOPER · MUMBAI · WEB / APPS / 3D / AI
      <animate attributeName="opacity" values="0;0.9" dur="0.9s" begin="1.7s" fill="freeze"/>
    </text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="337" rx="19" fill="none" stroke="url(#aurora)" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
